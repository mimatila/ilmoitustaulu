<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="top-nav">

  <button onclick="openCreatePopup()">Create Board</button>
  <button onclick="openJoinBoard()">
    Join Board
  </button>

</div>

<div id="boardCount">Boards: ...</div>
<div class="login-box">
  <h2>Board Login</h2>
  <label>Board Name:</label>
  <input id="boardName">
  <label>Board Password:</label>
  <input id="boardPassword" type="password">
   <label>Username”:</label>
  <input id="boardUsername">
  <button onclick="loginBoard()">Open Board</button>
  <button onclick="createBoard()">Create Board</button>
  <button onclick="deleteBoard()">Delete Board</button>
</div>

<div id="createPopup" class="popup">
  <div class="popup-content">

    <h3>Create Board</h3>

    <input id="cp_boardName" placeholder="Board Name">
    <input id="cp_username" placeholder="Username">
    <input id="cp_email" placeholder="Email">
    <input id="cp_ownerPassword" placeholder="Owner Password" type="password">
    <button onclick="submitCreateBoard()">Create</button>
    <button onclick="closeCreatePopup()">Cancel</button>

  </div>
</div>

<div id="joinBoardPopup" class="popup">

  <div class="popup-content">

    <h3>Join Board</h3>

    <label>Board Name</label>
    <input id="joinBoardName">

    <label>Username</label>
    <input id="joinUsername">

    <label>Password</label>
    <input id="joinPassword">

    <label>Email</label>
    <input id="joinEmail">

    <br>

    <button onclick="sendJoinRequest()">
      Send Request
    </button>

    <button onclick="closeJoinBoard()">
      Cancel
    </button>

  </div>

</div>

<script src="app.js"></script>

</body>
</html>
