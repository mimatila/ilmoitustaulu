<!DOCTYPE html>
<html>
<head>
  <title>Ilmoitustaulu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1 id="boardTitle"></h1>

<!-- 🟢 viimeksi paikalla -->
<div id="visitedUsers" class="visited-users"></div>

<div class="board-actions">

  <div class="actions-center">
  <label>
    <input type="checkbox" id="editMode">
    Edit
  </label>

  <label>
    <input type="checkbox" id="todayMode">
    Tänään
  </label>
</div>

  <button class="clear-btn" onclick="clearTable()">Clear</button>

</div>

<!-- viestit -->
<div class="board">
  <div id="boardMessagesDiv"></div>
</div>

<!-- viesti -->
<div class="input-row">
  <input id="boardNewMsg" placeholder="Kirjoita viesti">
  <button onclick="updateMessage()">Päivitä</button>
</div>

<div id="quickEditor" class="input-row">
  <select id="quickSelect">
    <option value="">Valitse tila...</option>
  </select>

  <button id="saveBtn" onclick="handleSaveClick()">
    Tallenna
  </button>
</div>

<div class="top-nav">
  <button onclick="koti()">Koti</button>
  <button onclick="logout()">Logout</button>
</div>

<script src="app.js"></script>

</body>
</html>
