<!DOCTYPE html>
<html>
<head>
  <title>Ilmoitustaulu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1 id="boardTitle"></h1>

<!-- 🟢 viimeksi paikalla -->
<div id="visitedUsers" class="visited-users"></div>

<div class="board-actions">

  <div class="actions-center">
  <label>
    <input type="checkbox" id="editMode">
    Edit
  </label>

  <label>
    <input type="checkbox" id="todayMode">
    Today
  </label>

  <label>
    <input type="checkbox" id="importantMode">
    Important
  </label>

  <label>
    <input type="checkbox" id="infoMode">
    Info
  </label>
</div>

  <button class="clear-btn" onclick="clearTable()">Clear</button>

</div>

<!-- viestit -->
<div class="board">
  <div id="boardMessagesDiv"></div>
</div>

<!-- viesti -->
<div class="input-row">
  <input id="boardNewMsg" placeholder="Kirjoita viesti">
  <button onclick="updateMessage()">Päivitä</button>
</div>

<div id="quickEditor" class="input-row">
  <select id="quickSelect">
    <option value="">Valitse tila...</option>
  </select>

  <button id="saveBtn" onclick="handleSaveClick()">
    Tallenna
  </button>
</div>

<div class="top-nav">

  <button onclick="openSettings()">
    Settings
  </button>

  <button onclick="koti()">
    Koti
  </button>

  <button onclick="logout()">
    Logout
  </button>

</div>

<div id="settingsPopup" class="popup">

  <div class="popup-content">

    <h3>Asetukset</h3>

    <label>
      Poista viestit vanhempina kuin
    </label>

    <input
      id="autoDeleteDays"
      type="number"
      min="1"
      max="365"
    >

    <span>päivää</span>

    <br><br>

    <button onclick="saveSettings()">
      Tallenna
    </button>

    <button onclick="closeSettings()">
      Sulje
    </button>

  </div>

</div>

<script src="app.js"></script>

</body>
</html>
